apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-codec
  namespace: temporal-sandbox
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: temporal-codec
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: temporal-codec
    spec:
      containers:
        - env:
            - name: CORS_ALLOW_ORIGINS
              value: https://*
            - name: CORS_ALLOW_HEADERS
              value: X-Namespace,Content-Type,Authorization
            - name: CORS_ALLOW_METHODS
              value: POST,OPTIONS,GET
            - name: PORT
              value: '8081'
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: ENCRYPTION_KEY
                  name: temporal-codec-secret
            - name: REQUIRE_AUTH
              value: 'false'
          image: 093126182733.dkr.ecr.us-east-1.amazonaws.com/temporal-codec-server:develop-0.1.0
          imagePullPolicy: Always
          name: codec
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
